name: Release Channels

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3-rc.1)"
        required: true
        type: string
      build_strategy:
        description: "Release build strategy"
        required: true
        type: choice
        default: local-uploaded-assets
        options:
          - local-uploaded-assets
          - github-hosted

env:
  CARGO_TERM_COLOR: always
  SIPALYZER_NATIVE_ARTIFACTS_DIR: ${{ vars.SIPALYZER_NATIVE_ARTIFACTS_DIR }}
  SIPALYZER_NATIVE_ARTIFACTS_URL: ${{ vars.SIPALYZER_NATIVE_ARTIFACTS_URL }}

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Channel Metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Validate updater distribution visibility
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.repository.private }}" == "true" ]]; then
            echo "This repository is private."
            echo "GitHub-hosted in-app updater requires the repository and release assets to be publicly accessible."
            echo "Set repository visibility to public before running channel releases."
            exit 1
          fi

      - name: Resolve tag and channel
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "${TAG}" ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+|-rc\.[0-9]+)?$ ]]; then
            echo "Invalid release tag format: ${TAG}" >&2
            echo "Expected: vX.Y.Z, vX.Y.Z-beta.N, or vX.Y.Z-rc.N" >&2
            exit 1
          fi

          CHANNEL="main"
          PRERELEASE="false"
          if [[ "${TAG}" =~ -beta\.[0-9]+$ ]]; then
            CHANNEL="beta"
            PRERELEASE="true"
          elif [[ "${TAG}" =~ -rc\.[0-9]+$ ]]; then
            CHANNEL="rc"
            PRERELEASE="true"
          fi

          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "release_name=SIPalyzer ${TAG} (${CHANNEL})" >> "$GITHUB_OUTPUT"

  strict-preflight:
    name: Strict Host-Agnostic Preflight
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Local strategy skip
        if: inputs.build_strategy == 'local-uploaded-assets'
        run: echo "Local strategy selected; skipping hosted strict preflight."

      - uses: actions/checkout@v4
        if: inputs.build_strategy == 'github-hosted'
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Guard strict lane against host package manager setup
        if: inputs.build_strategy == 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import sys

          workflow = pathlib.Path(".github/workflows/release-channels.yml").read_text(encoding="utf-8")
          match = re.search(r"# strict-lane:start(.*?)# strict-lane:end", workflow, re.S)
          if not match:
            print("Strict lane markers not found in release workflow.", file=sys.stderr)
            sys.exit(1)

          strict_block = match.group(1)
          if re.search(r"\b(?:brew|apt(?:-get)?|choco)\b", strict_block):
            print("Strict lane must not include brew/apt/choco setup.", file=sys.stderr)
            sys.exit(1)
          PY

      # strict-lane:start
      - name: Install Rust toolchain
        if: inputs.build_strategy == 'github-hosted'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Node.js
        if: inputs.build_strategy == 'github-hosted'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        if: inputs.build_strategy == 'github-hosted'
        run: npm ci

      - name: Fetch upstream native artifacts (strict lane)
        if: inputs.build_strategy == 'github-hosted'
        run: npm run fetch:native-artifacts:upstream -- --target x86_64-unknown-linux-gnu

      - name: Frontend build check (strict lane)
        if: inputs.build_strategy == 'github-hosted'
        run: npm run build

      - name: Validate native artifact manifest (strict lane)
        if: inputs.build_strategy == 'github-hosted'
        run: npm run validate:native-artifacts:strict

      - name: Rust core compile check (strict lane)
        if: inputs.build_strategy == 'github-hosted'
        run: cargo check --manifest-path src-tauri/crates/sipalyzer-core/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu
      # strict-lane:end

  validate-secrets:
    name: Validate Signing Secrets
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Local strategy skip
        if: inputs.build_strategy == 'local-uploaded-assets'
        run: echo "Local strategy selected; hosted signing secrets validation skipped."

      - name: Validate updater signing inputs
        if: inputs.build_strategy == 'github-hosted'
        shell: bash
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          [[ -n "${TAURI_PRIVATE_KEY}" ]] || { echo "Missing TAURI_PRIVATE_KEY"; exit 1; }
          [[ -n "${TAURI_KEY_PASSWORD}" ]] || { echo "Missing TAURI_KEY_PASSWORD"; exit 1; }
          [[ -n "${TAURI_UPDATER_PUBKEY}" ]] || { echo "Missing TAURI_UPDATER_PUBKEY"; exit 1; }
          echo "Updater signing secrets detected."

  release-extended:
    name: Build and Publish ${{ matrix.label }}
    needs: [prepare, strict-preflight, validate-secrets]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.build_strategy == 'github-hosted' && '{"include":[{"os":"macos-latest","target":"aarch64-apple-darwin","label":"macOS-arm64"}]}' || '{"include":[{"os":"ubuntu-latest","target":"local-noop","label":"local-artifacts"}]}') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Local strategy skip
        if: matrix.target == 'local-noop'
        run: echo "Local strategy selected; hosted build matrix skipped."

      - uses: actions/checkout@v4
        if: matrix.target != 'local-noop'
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Install Rust toolchain
        if: matrix.target != 'local-noop'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        if: matrix.target != 'local-noop'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        if: matrix.target != 'local-noop'
        run: npm ci

      - name: Fetch native artifacts bundle (extended lane)
        if: matrix.target != 'local-noop' && env.SIPALYZER_NATIVE_ARTIFACTS_URL != ''
        run: node ./scripts/fetch-native-artifacts.mjs --source "${{ env.SIPALYZER_NATIVE_ARTIFACTS_URL }}" --dest "${{ runner.temp }}/native-artifacts"

      - name: Hydrate target native artifacts from fetched bundle (extended lane)
        if: matrix.target != 'local-noop' && env.SIPALYZER_NATIVE_ARTIFACTS_URL != ''
        run: node ./scripts/hydrate-native-artifacts.mjs --source "${{ runner.temp }}/native-artifacts" --target ${{ matrix.target }}

      - name: Hydrate target native artifacts from mounted directory (extended lane)
        if: matrix.target != 'local-noop' && env.SIPALYZER_NATIVE_ARTIFACTS_URL == '' && env.SIPALYZER_NATIVE_ARTIFACTS_DIR != ''
        run: node ./scripts/hydrate-native-artifacts.mjs --source "${{ env.SIPALYZER_NATIVE_ARTIFACTS_DIR }}" --target ${{ matrix.target }}

      - name: Fetch upstream native artifacts (extended lane fallback)
        if: matrix.target != 'local-noop' && env.SIPALYZER_NATIVE_ARTIFACTS_URL == '' && env.SIPALYZER_NATIVE_ARTIFACTS_DIR == ''
        run: npm run fetch:native-artifacts:upstream -- --target ${{ matrix.target }}

      - name: Validate target native artifacts (extended lane)
        if: matrix.target != 'local-noop'
        run: node ./scripts/validate-native-artifacts.mjs --strict --target ${{ matrix.target }}

      - name: Install macOS dependencies (extended lane)
        if: matrix.target != 'local-noop' && runner.os == 'macOS'
        run: brew install libpcap

      - name: Install Windows dependencies (extended lane)
        if: matrix.target != 'local-noop' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          choco install npcap -y --no-progress 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Npcap install skipped (exit $LASTEXITCODE); continuing without bundled Npcap driver."
          }
          exit 0

      - name: Install Linux dependencies (extended lane)
        if: matrix.target != 'local-noop' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpcap-dev \
            libasound2-dev

      - name: Build and upload channel release
        if: matrix.target != 'local-noop'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          SIPALYZER_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        with:
          tagName: ${{ needs.prepare.outputs.release_tag }}
          releaseName: ${{ needs.prepare.outputs.release_name }}
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          args: --target ${{ matrix.target }}

  publish-updater-manifest:
    name: Publish updater manifest (${{ needs.prepare.outputs.channel }})
    needs: [prepare, release-extended]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit manifest into beta branch
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin beta
          git checkout -B beta origin/beta
          node ./scripts/github/generate-updater-manifest.mjs \
            --repo "${{ github.repository }}" \
            --tag "${RELEASE_TAG}" \
            --channel "${CHANNEL}" \
            --out "./updater/${CHANNEL}.json"
          mkdir -p updater
          git add "./updater/${CHANNEL}.json"
          if git diff --cached --quiet; then
            echo "No updater manifest changes detected."
            exit 0
          fi
          git commit -m "Update ${CHANNEL} updater manifest for ${RELEASE_TAG}"
          git push origin beta

