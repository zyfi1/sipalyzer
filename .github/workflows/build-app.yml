name: CI Quality Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cross-os-smoke:
    name: Cross-OS Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend smoke checks
        run: npm run typecheck && npm run test && npm run build

      - name: Setup bundled Go toolchain
        run: npm run setup:go-toolchain

      - name: Full OS parity suite (feature-level)
        run: npm run check:os-parity

      - name: Rust app compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  strict-host-agnostic:
    name: Strict Host-Agnostic Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard strict lane against host package manager setup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import sys

          workflow = pathlib.Path(".github/workflows/build-app.yml").read_text(encoding="utf-8")
          match = re.search(r"# strict-lane:start(.*?)# strict-lane:end", workflow, re.S)
          if not match:
            print("Strict lane markers not found in build-app workflow.", file=sys.stderr)
            sys.exit(1)

          strict_block = match.group(1)
          if re.search(r"\b(?:brew|apt(?:-get)?|choco)\b", strict_block):
            print("Strict lane must not include brew/apt/choco setup.", file=sys.stderr)
            sys.exit(1)
          PY

      # strict-lane:start
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch upstream native artifacts (strict lane)
        run: npm run fetch:native-artifacts:upstream

      - name: Frontend typecheck (strict lane)
        run: npm run typecheck

      - name: Validate native artifact manifest (strict lane)
        run: npm run validate:native-artifacts:strict

      - name: Rust core compile check (strict lane)
        run: cargo check --manifest-path src-tauri/crates/sipalyzer-core/Cargo.toml --all-targets
      # strict-lane:end

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend checks
        run: npm run check:frontend

      - name: Troubleshooting guardrail tests
        run: npm run test:troubleshooting

      - name: Packet fidelity checks
        run: npm run test:packet-fidelity

      - name: Rust format check (core lane)
        run: npm run rust:fmt:check

      - name: Rust clippy check (core lane)
        run: npm run rust:clippy

      - name: Rust tests (core lane)
        run: npm run rust:test

      - name: Rust format check (full app lane)
        run: npm run rust:fmt:check:app

      - name: Rust clippy check (full app lane)
        run: npm run rust:clippy:app

      - name: Rust tests (full app lane)
        run: npm run rust:test:app
