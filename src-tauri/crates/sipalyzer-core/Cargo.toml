[package]
name = "sipalyzer-core"
version = "0.1.0"
edition = "2021"
description = "Shared protocol types for SIPalyzer remote agent communication"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1.6", features = ["v4", "serde"] }
hex = "0.4"
